name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_URL" ]; then
            echo "Error: RENDER_DEPLOY_URL secret is not set"
            exit 1
          fi
          curl -s --fail-with-body "$RENDER_DEPLOY_URL"
